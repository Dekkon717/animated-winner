name: 姣忔棩涓栫晫绠€鎶?
on:
  schedule:
    # GitHub 浣跨敤 UTC锛?3:00 UTC 瀵瑰簲鍖椾含鏃堕棿 07:00銆?    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 妫€鍑轰唬鐮?        uses: actions/checkout@v4

      - name: 瀹夎 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 瀹夎 uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: 瀹夎渚濊禆
        run: uv sync

      - name: 鍑嗗閰嶇疆
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        run: |
          cp data/config.github.json data/config.json
          printf '[\n  "%s"\n]\n' "$EMAIL_ADDRESS" > data/subscribers.json

      - name: 鐢熸垚骞跺彂閫佺畝鎶?        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        run: uv run horizon --hours 24
